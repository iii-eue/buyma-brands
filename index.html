<style>
:root{
  --bg:#d9e4ef; --surface:rgba(255,255,255,.62); --ink:#0e1620; --sub:#56677a; --faint:#8a9bad;
  --line:rgba(14,22,32,.16); --line2:rgba(14,22,32,.42); --olive:#5d6a2a; --khaki:#5f6b3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;text-align:center}
.wrap{max-width:760px;margin:0 auto;padding:96px 24px 140px}
.eyebrow{font-size:11px;font-weight:400;letter-spacing:.42em;text-transform:uppercase;color:var(--sub)}
h1{font-size:clamp(56px,13vw,112px);font-weight:200;letter-spacing:-.02em;line-height:1;margin:18px 0 20px}
.lead{font-size:12px;font-weight:300;color:var(--sub);letter-spacing:.14em}
.dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--olive);margin:36px auto 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:28px 0 18px}
.bar input{width:100%;max-width:420px;font:inherit;font-size:15px;font-weight:300;text-align:center;letter-spacing:.06em;padding:12px 4px;background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);outline:none;border-radius:0}
.bar input:focus{border-bottom-color:var(--ink)}
.bar input::placeholder{color:var(--faint)}
#count{display:block;margin-top:10px;font-size:11px;letter-spacing:.3em;color:var(--sub)}
.row{display:flex;flex-direction:column;align-items:center;gap:10px;padding:64px 0 56px;border-top:1px solid var(--line)}
.name{font-size:24px;font-weight:300;letter-spacing:.04em;line-height:1.35;word-break:break-word}
.meta{font-size:11px;letter-spacing:.3em;color:var(--sub)}
.note{font-size:12px;color:var(--olive);letter-spacing:.06em}
.memo{position:relative;width:100%;margin-top:14px}
textarea{display:block;width:100%;min-height:150px;font:inherit;font-size:14px;font-weight:300;line-height:1.9;text-align:left;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:2px;color:var(--khaki);resize:vertical;outline:none;transition:border-color .15s,background .15s}
textarea:focus{border-color:var(--line2);background:rgba(255,255,255,.85)}
textarea::placeholder{color:var(--faint)}
.saved{position:absolute;right:14px;bottom:10px;font-size:11px;letter-spacing:.1em;color:var(--olive);opacity:0;transition:opacity .25s;pointer-events:none}
.saved.show{opacity:1}
.open{margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--olive);padding-bottom:3px}
.open:hover{color:var(--olive)}
.open:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.off{margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--faint)}
.empty{padding:80px 0;color:var(--sub);font-size:13px;letter-spacing:.1em;border-top:1px solid var(--line)}
@media(max-width:700px){
  .wrap{padding:64px 18px 100px}
  .row{padding:48px 0 44px}
  .name{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* メモは従来と同じキー・同じ「ブランド名」で保存(既存メモはそのまま残ります) */
const MEMO_KEY = "buyma_memos";
function loadMemos(){ try { return JSON.parse(localStorage.getItem(MEMO_KEY) || "{}"); } catch { return {}; } }
function saveMemo(name, val){
  try { const m = loadMemos(); m[name] = val; localStorage.setItem(MEMO_KEY, JSON.stringify(m)); } catch {}
}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* 愛用者・雑誌タグは、メモが空のときだけ最初からメモ欄に入れる */
const seedMemo = b => b.memo || "";

function grow(el){ el.style.height = "auto"; el.style.height = Math.max(150, el.scrollHeight + 2) + "px"; }

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const memos = loadMemos();
  const rows = brands.map((b, i) => ({ b, i })).filter(({ b }) => b.name.toLowerCase().includes(q));
  document.getElementById("count").textContent = rows.length + " 件";
  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<div class="empty">該当するブランドがありません</div>'; return; }

  list.innerHTML = rows.map(({ b, i }) => `
    <section class="row">
      <div class="name">${esc(b.name)}</div>
      ${b.date ? `<div class="meta">${esc(b.date)}</div>` : ""}
      ${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}
      <div class="memo">
        <textarea data-i="${i}" placeholder="メモを入力" aria-label="${esc(b.name)} のメモ">${esc(memos[b.name] || seedMemo(b))}</textarea>
        <span class="saved" id="saved-${i}">保存しました</span>
      </div>
      ${b.url
        ? `<a class="open" href="${esc(b.url)}" target="_blank" rel="noopener">コピー元ページはココをCLICK</a>`
        : `<span class="off">リンクなし</span>`}
    </section>`).join("");

  list.querySelectorAll("textarea").forEach(el => {
    grow(el);
    el.addEventListener("input", () => {
      grow(el);
      const i = el.dataset.i;
      saveMemo(brands[i].name, el.value);
      const ind = document.getElementById("saved-" + i);
      ind.classList.add("show");
      clearTimeout(ind._t);
      ind._t = setTimeout(() => ind.classList.remove("show"), 1400);
    });
  });
}

document.getElementById("search").addEventListener("input", render);
render();
</script>
</body>
</html>
